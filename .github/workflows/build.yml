name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Poner Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk python3-pip zip unzip git libltdl-dev libffi-dev libssl-dev build-essential autoconf libtool pkg-config zlib1g-dev libncurses5-dev
          pip install --upgrade pip
          pip install "Cython==0.29.36" buildozer

      - name: Compilar APK
        run: |
          buildozer -v android debug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: mi-apk
          path: bin/*.apk
          if-no-files-found: error
